name: Build APKs
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build LacosteAutoTransfer
        working-directory: LacosteAutoTransfer
        run: gradle assembleDebug --no-daemon
      - name: Build LCVerificationAndroid
        working-directory: LCVerificationAndroid
        run: gradle assembleDebug --no-daemon
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APKs-Lacoste
          path: "**/build/outputs/apk/debug/*.apk"
